name: Daily Weather Bot

on:
  schedule:
    # ⚠️ 깃허브도 UTC(영국 시간) 기준입니다. 한국 시간 아침 7시 30분은 '22:30'입니다.
    # 분 시 일 월 요일 순서입니다.
    - cron: '30 22 * * *'
  workflow_dispatch: # 내가 원할 때 수동으로도 실행해 볼 수 있게 만드는 버튼입니다.

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run Weather Bot
      run: |
        python weather_bot_v3.py
      env:                                          # ← 이 블록이 없다면 통째로 추가
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
