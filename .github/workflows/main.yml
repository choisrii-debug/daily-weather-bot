name: Run Weather Bot
on:
  schedule:
    - cron: '59 21 * * *'
  workflow_dispatch:

permissions:
  contents: write   # ← 이 블록 추가 (페이지 파일을 저장소에 다시 push하려면 필요)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run Weather Bot
      run: python weather_bot_v3.py
      env:
        KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}

    - name: Commit and push weather page   # ← 이 스텝 추가
      run: |
        git config user.name "weather-bot"
        git config user.email "bot@users.noreply.github.com"
        git add docs/
        git diff --staged --quiet || git commit -m "오늘의 날씨 페이지 업데이트"
        git push
