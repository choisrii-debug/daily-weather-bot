<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 매일 운세 배달</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; text-align: center; padding: 20px; background-color: #f7f6f3; color: #1c2430; margin: 0; }
        .card { background: white; padding: 30px 20px; border-radius: 20px; border: 1px solid #eee6d8; max-width: 380px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #5c4a2f; margin-bottom: 5px; }
        .sub-title { font-size: 13px; color: #888; margin-bottom: 25px; }
        .btn { background: linear-gradient(135deg, #ff7b00 0%, #ff385c 100%); color: white; border: none; padding: 14px 28px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(255, 56, 92, 0.3); }
        select { padding: 12px 20px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; width: 80%; margin-bottom: 20px; outline: none; }
        .fortune-text { font-size: 18px; line-height: 1.8; font-weight: 500; margin: 20px 0; color: #2c3e50; }
        .item-box { background-color: #fff8ec; border: 1px dashed #f0dfc0; border-radius: 12px; padding: 15px; margin: 25px 0; }
        .item-title { font-size: 12px; color: #ff7b00; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.1em; }
        .item-name { font-size: 18px; font-weight: bold; color: #ff385c; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔮 진아의 매일 운세</h1>
        <div class="sub-title">Daily Fortune Delivery</div>

        <div id="setup-view" style="display: none;">
            <p style="font-size: 15px; color: #555;">매일 아침 행운을 배달받을<br><strong>나의 띠</strong>를 선택해주세요!</p>
            <select id="my-sign">
                <option value="mouse">🐭 쥐띠</option>
                <option value="cow">🐮 소띠</option>
                <option value="tiger">🐯 호랑이띠</option>
                <option value="rabbit">🐰 토끼띠</option>
                <option value="dragon">🐲 용띠</option>
                <option value="snake">🐍 뱀띠</option>
                <option value="horse">🐴 말띠</option>
                <option value="sheep">🐏 양띠</option>
                <option value="monkey">🐵 원숭이띠</option>
                <option value="rooster">🐔 닭띠</option>
                <option value="dog">🐶 개띠</option>
                <option value="pig">🐷 돼지띠</option>
            </select>
            <br>
            <button class="btn" onclick="saveMySign()">오늘의 운세 보기</button>
        </div>

        <div id="fortune-view" style="display: none;">
            <h2 id="user-sign-title" style="margin-top:0; color:#ff385c;">🐭 오늘의 운세</h2>
            <div id="today-date" style="font-size: 12px; color: #aaa; margin-top:-10px; margin-bottom: 20px;"></div>
            <p id="fortune-text" class="fortune-text">운세를 불러오는 중입니다...</p>
            
            <div class="item-box">
                <div class="item-title">🍀 오늘 나를 지켜줄 행운템</div>
                <div id="lucky-item-name" class="item-name">로딩중...</div>
            </div>
            
            <a id="coupang-btn" href="#" target="_blank" class="btn">🚀 행운템 최저가 혜택받기</a>
        </div>
    </div>

    <script>
        // ★ 중요: 여기에 진아님의 Firebase Realtime DB 기본 주소를 적어주세요! (.json 제외)
        // 예시: "https://daily-weather-bot-default-rtdb.firebaseio.com"
        const FIREBASE_BASE_URL = "https://your-firebase-database-id.firebaseio.com"; 

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('today-date').innerText = today;

        const savedSign = localStorage.getItem('user_sign');

        if (!savedSign) {
            document.getElementById('setup-view').style.display = 'block';
        } else {
            showFortune(savedSign);
        }

        function saveMySign() {
            const selectedSign = document.getElementById('my-sign').value;
            localStorage.setItem('user_sign', selectedSign);
            document.getElementById('setup-view').style.display = 'none';
            showFortune(selectedSign);
        }

        async function showFortune(sign) {
            document.getElementById('fortune-view').style.display = 'block';

            try {
                // Firebase Realtime DB에서 오늘 자 운세 가져오기
                const response = await fetch(`${FIREBASE_BASE_URL}/fortunes/${today}/${sign}.json`);
                const data = await response.json();

                if (data) {
                    document.getElementById('user-sign-title').innerText = `✨ 오늘의 ${data.sign} 운세`;
                    document.getElementById('fortune-text').innerText = data.luck;
                    document.getElementById('lucky-item-name').innerText = data.lucky_item;
                    document.getElementById('coupang-btn').href = data.coupang_url;
                } else {
                    document.getElementById('fortune-text').innerText = "아직 오늘 자 운세가 발송되지 않았습니다. 아침 7시에 다시 찾아와 주세요!";
                }
            } catch (error) {
                document.getElementById('fortune-text').innerText = "운세를 읽어오는 중 에러가 발생했습니다. 주소를 다시 확인해 주세요!";
                console.error(error);
            }
        }
    </script>
</body>
</html>
